name: Publicar el Atlas en GitHub Pages

# Compila la web y la publica en cada push a main.
# Tambien se puede disparar a mano desde la pestana Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan varios push seguidos, publica solo el ultimo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: web

      # npm run build corre antes sync-data.mjs, que lee base-conocimiento/
      # y corta el build si queda alguna ruta local en los datos.
      - name: Compilar la web
        run: npm run build
        working-directory: web

      - name: Verificar los motores de calculo (M03, M05, M09)
        run: npm run verify
        working-directory: web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
